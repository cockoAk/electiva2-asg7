services:
  app:
    build: .
    container_name: php-hola-mundo
    ports:
      - "8081:80"
    volumes:
      - ./src:/var/www/html
    environment:
      DB_HOST: db
      DB_NAME: holamundo
      DB_USER: usuario
      DB_PASSWORD: usuario123
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    container_name: mysql-hola-mundo
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: holamundo
      MYSQL_USER: usuario
      MYSQL_PASSWORD: usuario123
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  db_data:
